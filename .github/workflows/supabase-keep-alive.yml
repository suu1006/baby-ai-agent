name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase Auth
    runs-on: ubuntu-latest

    steps:
      - name: Call Supabase Auth settings endpoint
        run: |
          curl --fail --show-error --silent "$SUPABASE_URL/auth/v1/settings" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            >/dev/null
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
